name: build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Smoke test against the bundled sample
        run: |
          dotnet run --project src/BlogMlToWxr/BlogMlToWxr.csproj --configuration Release --no-build -- \
            --input samples/BlogML-sample.xml \
            --output ./ci-output \
            --site https://ridilabs.net \
            --no-media
          test -f ./ci-output/report.md
          test -f ./ci-output/redirects.csv
          ls ./ci-output

      - name: Upload conversion output
        uses: actions/upload-artifact@v4
        with:
          name: sample-conversion
          path: ci-output/
